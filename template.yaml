AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Spotter backend - live phone-to-TV link (AppSync Events), pairing and session API
  (HTTP API + Lambda) and the data table (DynamoDB). Everything is deleted with the stack.

Parameters:
  ApiKeyExpires:
    Type: Number
    Description: Unix time (seconds) when the AppSync Events API key expires. The deploy workflow sets it 60 days ahead.

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10

Resources:
  # Live link: the camera device publishes pose events, the TV subscribes. One channel per session.
  EventsApi:
    Type: AWS::AppSync::Api
    Properties:
      Name: spotter-events
      EventConfig:
        AuthProviders:
          - AuthType: API_KEY
        ConnectionAuthModes:
          - AuthType: API_KEY
        DefaultPublishAuthModes:
          - AuthType: API_KEY
        DefaultSubscribeAuthModes:
          - AuthType: API_KEY

  SessionNamespace:
    Type: AWS::AppSync::ChannelNamespace
    Properties:
      ApiId: !GetAtt EventsApi.ApiId
      Name: session

  EventsApiKey:
    Type: AWS::AppSync::ApiKey
    Properties:
      ApiId: !GetAtt EventsApi.ApiId
      Description: Public client key for the Spotter TV and camera apps
      Expires: !Ref ApiKeyExpires

  # Provisioned 2/2 capacity stays inside DynamoDB's always-free tier.
  DataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: spotter-data
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 2
        WriteCapacityUnits: 2
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        # Listed here, not as a parameter: sam deploy keeps a parameter's previous value, so a
        # changed default never reached the stack.
        AllowOrigins:
          - https://mallikarjuntr.github.io
          - https://spotter-tv.netlify.app
          - http://localhost:5173
          - http://localhost:4173
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type]
        MaxAge: 600
      # Caps abuse of the public endpoint so it can't run up a bill.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      # Each AI analysis costs money (Bedrock), so this route is held much tighter.
      RouteSettings:
        'POST /coach/analysis':
          ThrottlingBurstLimit: 2
          ThrottlingRateLimit: 1

  ApiFunctionLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: /aws/lambda/spotter-api
      RetentionInDays: 7

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: spotter-api
      CodeUri: ./
      Handler: index.handler
      LoggingConfig:
        LogGroup: !Ref ApiFunctionLogs
      Environment:
        Variables:
          TABLE_NAME: !Ref DataTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
        CreateSession:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /sessions
            Method: POST
        GetSession:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /sessions/{code}
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/api/index.ts
        Target: es2022
        Format: esm
        OutExtension:
          - .js=.mjs
        Minify: true
        Sourcemap: false
        External:
          - '@aws-sdk/*'

  CoachFunctionLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: /aws/lambda/spotter-coach
      RetentionInDays: 7

  # "Analyse with AI": the TV sends a workout's numbers (no video, no body points) and Claude on
  # Amazon Bedrock writes the report. The Bedrock keys are read from Parameter Store at runtime.
  CoachFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: spotter-coach
      CodeUri: ./
      Handler: index.handler
      # API Gateway gives up at 30 s.
      Timeout: 29
      LoggingConfig:
        LogGroup: !Ref CoachFunctionLogs
      Environment:
        Variables:
          TABLE_NAME: !Ref DataTable
          BEDROCK_REGION: us-east-1
          # Classic InvokeModel inference profiles, best first (see src/coach/index.ts).
          BEDROCK_MODELS: global.anthropic.claude-opus-5-5,global.anthropic.claude-opus-5,global.anthropic.claude-opus-4-8,global.anthropic.claude-haiku-5-5
          KEY_ID_PARAM: /spotter/bedrock/access-key-id
          SECRET_PARAM: /spotter/bedrock/secret-access-key
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameters
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/spotter/bedrock/*
            - Effect: Allow
              Action: kms:Decrypt
              Resource: '*'
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        Analyse:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /coach/analysis
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/coach/index.ts
        Target: es2022
        Format: esm
        OutExtension:
          - .js=.mjs
        Minify: true
        Sourcemap: false
        # The Bedrock SDK and its AWS credential helpers are bundled; only the clients the
        # Lambda runtime is known to ship stay external.
        External:
          - '@aws-sdk/client-dynamodb'
          - '@aws-sdk/lib-dynamodb'
          - '@aws-sdk/client-ssm'
        # Bundled CommonJS packages require Node built-ins (http, fs, crypto); give the ES module a require().
        Banner:
          - js=import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);

  VoiceFunctionLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: /aws/lambda/spotter-voice
      RetentionInDays: 7

  # Records the coach's lines with Amazon Polly. No HTTP route: only the deploy workflow invokes it.
  VoiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: spotter-voice
      CodeUri: ./
      Handler: index.handler
      Timeout: 120
      LoggingConfig:
        LogGroup: !Ref VoiceFunctionLogs
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - polly:SynthesizeSpeech
                - polly:DescribeVoices
              Resource: '*'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/voice/index.ts
        Target: es2022
        Format: esm
        OutExtension:
          - .js=.mjs
        Minify: true
        Sourcemap: false
        External:
          - '@aws-sdk/*'

Outputs:
  ApiUrl:
    Description: Base URL of the session API.
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  EventsHttpEndpoint:
    Description: AppSync Events HTTP endpoint (publish).
    Value: !GetAtt EventsApi.Dns.Http
  EventsRealtimeEndpoint:
    Description: AppSync Events realtime endpoint (subscribe over WebSocket).
    Value: !GetAtt EventsApi.Dns.Realtime
  EventsApiKey:
    Description: Public client key for the apps (also visible in the client code).
    Value: !GetAtt EventsApiKey.ApiKey
