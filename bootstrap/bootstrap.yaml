AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Spotter bootstrap - deploy once by hand (CloudShell or console). Lets GitHub Actions in the
  spotter-backend repo deploy the Spotter stack through GitHub OIDC (no stored AWS keys),
  creates the artifacts bucket used by SAM deploys, and adds a monthly budget alert.

Parameters:
  GitHubOwner:
    Type: String
    Default: Mallikarjuntr
  GitHubRepo:
    Type: String
    Default: spotter-backend
  CreateOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Set to false if this account already has the token.actions.githubusercontent.com OIDC provider.
  AlertEmail:
    Type: String
    Description: Email address that receives budget alerts.
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
  MonthlyBudget:
    Type: Number
    Default: 10
    Description: Monthly cost budget for the whole account.
  BudgetUnit:
    Type: String
    AllowedValues: [USD, INR]
    Default: USD

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub spotter-artifacts-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-artifacts
            Status: Enabled
            ExpirationInDays: 14

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: spotter-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOwner}/${GitHubRepo}:ref:refs/heads/main
                  - !Sub repo:${GitHubOwner}/${GitHubRepo}:ref:refs/heads/dev
      Policies:
        - PolicyName: spotter-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: StackServices
                Effect: Allow
                Action:
                  - cloudformation:*
                  - lambda:*
                  - apigateway:*
                  - appsync:*
                  - dynamodb:*
                  - logs:*
                  - budgets:ViewBudget
                Resource: '*'
              - Sid: ArtifactsBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt ArtifactsBucket.Arn
                  - !Sub ${ArtifactsBucket.Arn}/*
              - Sid: SpotterRolesOnly
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/spotter-*

  AccountBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: spotter-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudget
          Unit: !Ref BudgetUnit
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

Outputs:
  DeployRoleArn:
    Description: Put this in the spotter-backend repo as the Actions variable AWS_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
  ArtifactsBucketName:
    Description: Put this in the spotter-backend repo as the Actions variable SAM_ARTIFACTS_BUCKET.
    Value: !Ref ArtifactsBucket
