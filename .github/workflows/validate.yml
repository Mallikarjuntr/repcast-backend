name: Validate

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # sam build bundles with esbuild from PATH; use the locked project version
      - run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - run: npm run typecheck
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cfn-lint
      - run: cfn-lint --regions ap-south-1 -- template.yaml bootstrap/bootstrap.yaml
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - run: sam build
