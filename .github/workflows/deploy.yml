name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  STACK_NAME: spotter

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, to tell whether this push changed the coach's lines.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # sam build bundles with esbuild from PATH; use the locked project version
      - run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - run: npm test
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Show the OIDC subject AWS will check
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          CLAIMS=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null || true)
          echo "::notice title=OIDC subject::$(echo "$CLAIMS" | jq -r '.sub') | aud=$(echo "$CLAIMS" | jq -r '.aud')"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: sam build
      - name: Deploy stack
        run: |
          sam deploy \
            --stack-name "$STACK_NAME" \
            --s3-bucket "${{ vars.SAM_ARTIFACTS_BUCKET }}" \
            --s3-prefix "$STACK_NAME" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "ApiKeyExpires=$(date -d '+60 days' +%s)"
      - name: Record the coach's voice (only when voice/phrases.json changed)
        env:
          BEFORE: ${{ github.event.before }}
          BUCKET: ${{ vars.SAM_ARTIFACTS_BUCKET }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null \
            && [ -z "$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- voice/phrases.json)" ]; then
            echo "Coach lines unchanged; skipping."
            exit 0
          fi
          jq -c '{phrases: .}' voice/phrases.json > payload.json
          aws lambda invoke --function-name spotter-voice --cli-binary-format raw-in-base64-out \
            --cli-read-timeout 300 --payload fileb://payload.json out.json > invoke.json
          if jq -e '.FunctionError' invoke.json > /dev/null; then jq . out.json; exit 1; fi
          mkdir voice-out
          jq -r '.clips | to_entries[] | "\(.key) \(.value)"' out.json | while read -r id b64; do
            echo "$b64" | base64 -d > "voice-out/$id.mp3"
          done
          (cd voice-out && zip -q ../voice.zip ./*.mp3)
          KEY="voice/voice-${GITHUB_SHA::7}.zip"
          aws s3 cp voice.zip "s3://$BUCKET/$KEY" --only-show-errors
          echo "::notice title=Voice::$(jq -r '"\(.voice) (\(.engine)) - \(.lines) lines, \(.characters) characters"' out.json)"
          echo "::notice title=Voice clips (link valid for 1 hour)::$(aws s3 presign "s3://$BUCKET/$KEY" --expires-in 3600)"
      - name: Stack outputs and budget
        run: |
          {
            echo "## Stack outputs"
            echo '```'
            aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[].[OutputKey,OutputValue]" --output text
            echo '```'
            echo "## Budget (spotter-monthly)"
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            aws budgets describe-budget --account-id "$ACCOUNT_ID" --budget-name spotter-monthly \
              --query "Budget.{limit:BudgetLimit.Amount,unit:BudgetLimit.Unit,actual:CalculatedSpend.ActualSpend.Amount,forecast:CalculatedSpend.ForecastedSpend.Amount}" \
              --output table || echo "Budget not readable"
          } >> "$GITHUB_STEP_SUMMARY"
